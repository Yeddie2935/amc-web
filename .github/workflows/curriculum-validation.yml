name: Curriculum Validation

on:
  pull_request:
    paths:
      - "src/data/curriculum/**"
      - "src/types/curriculum.ts"
      - "tools/validate-curriculum.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "src/data/curriculum/**"
      - "src/types/curriculum.ts"
      - "tools/validate-curriculum.mjs"
      - "package.json"

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:curriculum
